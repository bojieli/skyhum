name: lint
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: ruff
        run: ruff check src tests scripts
      - name: CLI reference is current
        run: python scripts/gen_cli_docs.py --check
      - name: no audio, weights, big files or key-like strings
        run: scripts/prepub_check.sh
