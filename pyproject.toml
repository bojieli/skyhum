[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skyhum"
dynamic = ["version"]
description = "Test whether your audio carries an aircraft-Doppler location clue: verify, audit, scrub (local only)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "skyhum contributors" }]
keywords = ["audio", "privacy", "geolocation", "ads-b", "doppler", "audit"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
  "Topic :: Security",
]
dependencies = [
  "numpy>=1.23",
  "scipy>=1.9",
  "soundfile>=0.12",
  "webrtcvad-wheels>=2.0.11",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.6"]
locator = ["torch>=2.1"]   # the r5b locator (default matcher); the CPU build is enough
gpu = ["torch>=2.1"]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
skyhum = "skyhum.cli:main"

[tool.setuptools.dynamic]
version = { attr = "skyhum.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
skyhum = ["data/*.json", "_vendor/afg/LICENSE", "models/SHA256SUMS", "models/*.md", "models/*/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: r5b locator on CPU, minutes"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]
extend-exclude = ["third_party", "src/skyhum/_vendor", "src/skyhum/match/r5b.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E741", "B905"]
